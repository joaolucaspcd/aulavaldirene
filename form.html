<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<style>
     body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 40px;
}
h1 {
font-family: 'Georgia', serif;
font-size: 40px;
letter-spacing: 3px;
margin-bottom: 30px;
text-align: center;

position: relative;
animation: mover 3s infinite alternate ease-in-out;
}

@keyframes mover {
0% {
    left: -20px;
    color: red;
}

50% {
    color: blue;
}

100% {
    left: 20px;
    color: green;
}
}
}


@keyframes mover {
from {
    left: -20px;
}
to {
    left: 20px;
}
}
}

form, fieldset {
    width: 60%;
    margin: 0 auto 25px auto;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #d4a373;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

fieldset h3 {
    font-family: 'Georgia', serif;
    font-size: 22px;
    letter-spacing: 2px;
}

label {
    font-weight: 600;
    display: block;
    margin-top: 10px;
    font-size: 15px;
}

input, textarea, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #b08968;
    font-size: 14px;
    font-family: inherit;
}

input[type="radio"],
input[type="checkbox"] {
    width: auto;
    margin-right: 5px;
}

textarea {
    resize: none;
}

button {
    display: block;
    margin: 30px auto 10px auto;
    padding: 10px 25px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: scale(1.05);
}

input[type="reset"] {
    display: block;
    margin: 10px auto;
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid #b08968;
    cursor: pointer;
    font-weight: bold;
}

p {
    width: 60%;
    margin: 0 auto;
}
</style>
<body style="background-color: thistle">

<h1 style="text-align: center">𝙁𝙖𝙘̧𝙖 𝙨𝙚𝙪 𝙘𝙖𝙙𝙖𝙨𝙩𝙧𝙤 𝙖𝙦𝙪𝙞 !</h1>

<form name="form-test" method="POST">

<br>
<label> ultimo nome: </label>

<form>

</form>

<br>

<input type="checkbox" name="carro"> Eu tenho um carro
<br><br>

<input type="checkbox" name="surf"> Eu tenho uma prancha de surf

</fieldset>

<input type="text" name="data_admissao">

</body>
</html>
